<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | منصة أبواب التعليمية</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --abwaab-green: #00B67A;
            --abwaab-green-dark: #00925F;
            --abwaab-green-light: #E6F8F2;
            --abwaab-dark: #1E293B;
            --abwaab-bg: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --border-color: #E2E8F0;
            --radius-btn: 12px;
            --radius-box: 16px;
            --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.04);
            --transition: all 0.25s ease-in-out;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; }
        body { background: var(--abwaab-bg); color: var(--text-main); }

        header { background: #FFFFFF; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100; }
        .nav-container { max-width: 1280px; margin: auto; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 24px; font-weight: 900; color: var(--abwaab-green); text-decoration: none; }
        .logo span { color: var(--abwaab-dark); }
        .nav-links { display: flex; list-style: none; gap: 32px; align-items: center; }
        .nav-links a { text-decoration: none; color: var(--text-muted); font-weight: 700; font-size: 15px; transition: var(--transition); }
        .nav-links a:hover, .nav-links a.active { color: var(--abwaab-green); }

        .container { max-width: 1050px; margin: 40px auto; padding: 0 24px; }
        
        /* بطاقة الترحيب والإحصائيات */
        .profile-banner { background: linear-gradient(135deg, #064E3B 0%, #006A4E 60%, #00B67A 100%); color: white; border-radius: var(--radius-box); padding: 35px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; box-shadow: 0 10px 25px rgba(0,182,122,0.2); }
        .profile-info h1 { font-size: 26px; font-weight: 900; margin-bottom: 6px; }
        .profile-info p { opacity: 0.9; font-size: 14px; color: #ECFDF5; }
        
        .stats-badge-box { background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(8px); padding: 16px 26px; border-radius: 14px; text-align: center; border: 1px solid rgba(255,255,255,0.3); }
        .stats-badge-box span { display: block; font-size: 13px; opacity: 0.85; }
        .stats-badge-box strong { font-size: 24px; font-weight: 900; color: #FDE047; }

        /* الأقسام والشبكات */
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 30px; }
        .dash-card { background: var(--card-bg); border-radius: var(--radius-box); padding: 25px; border: 1px solid var(--border-color); box-shadow: var(--shadow-card); }
        .dash-card h3 { font-size: 18px; font-weight: 800; color: var(--abwaab-dark); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }

        .info-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border-color); font-size: 14px; font-weight: 700; }
        .info-row:last-child { border-bottom: none; }
        .info-row span:last-child { color: var(--text-muted); font-weight: 600; }

        .history-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        .history-table th, .history-table td { padding: 12px; text-align: right; border-bottom: 1px solid var(--border-color); }
        .history-table th { font-weight: 800; color: var(--text-muted); font-size: 13px; }
        .history-table td { font-weight: 700; color: var(--abwaab-dark); }

        .btn-refresh { background: var(--abwaab-green); color: white; border: none; padding: 10px 20px; border-radius: var(--radius-btn); font-weight: 800; cursor: pointer; font-size: 13px; margin-top: 16px; transition: var(--transition); }
        .btn-refresh:hover { background: var(--abwaab-green-dark); }

        .not-logged { text-align: center; padding: 60px 20px; background: white; border-radius: var(--radius-box); border: 1px solid var(--border-color); }
        .not-logged h2 { font-size: 22px; font-weight: 900; margin-bottom: 10px; color: var(--abwaab-dark); }
        .not-logged p { color: var(--text-muted); font-size: 14px; margin-bottom: 20px; }
        .btn-main { background: var(--abwaab-green); color: white; border: none; padding: 12px 28px; border-radius: var(--radius-btn); font-weight: 800; cursor: pointer; text-decoration: none; display: inline-block; }
    </style>
</head>
<body>
    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">🟢 أبواب <span>Abwaab</span></a>
            <ul class="nav-links">
                <li><a href="index.html">الرئيسية</a></li>
                <li><a href="courses.html">المسارات والدروس</a></li>
                <li><a href="dashboard.html" class="active">لوحة التحكم</a></li>
            </ul>
        </div>
    </header>

    <div class="container" id="mainContainer">
        <!-- يتم تعبئة المحتوى ديناميكياً عبر الجافاسكريبت حسب حالة تسجيل الدخول -->
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD-PlaceholderKey-ChangeMeIfNeeded",
            authDomain: "green-damietta.firebaseapp.com",
            databaseURL: "https://green-damietta-b0a29-default-rtdb.firebaseio.com",
            projectId: "green-damietta",
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();

        const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
        const email = localStorage.getItem('userEmail');
        const name = localStorage.getItem('userName');
        const country = localStorage.getItem('selectedCountry') || 'eg';
        const grade = localStorage.getItem('selectedGrade') || 'eg_sec3';

        const container = document.getElementById('mainContainer');

        // خريطة أسماء الدول والصفوف لعرضها بوضوح في لوحة التحكم
        const countryNames = { eg: 'جمهورية مصر العربية', sa: 'المملكة العربية السعودية', jo: 'المملكة الأردنية الهاشمية', ae: 'الإمارات العربية المتحدة', iq: 'الجمهورية العراقية', kw: 'دولة الكويت' };
        const gradeNames = {
            eg_prim4: 'الصف الرابع الابتدائي', eg_prim5: 'الصف الخامس الابتدائي', eg_prim6: 'الصف السادس الابتدائي',
            eg_prep1: 'الصف الأول الاعدادي', eg_prep2: 'الصف الثاني الاعدادي', eg_prep3: 'الصف الثالث الاعدادي',
            eg_sec1: 'الصف الأول الثانوي', eg_sec2: 'الصف الثاني الثانوي', eg_sec3: 'الصف الثالث الثانوي (الثانوية العامة)',
            sa_prim4: 'الصف الرابع الابتدائي', sa_sec3: 'الصف الثالث الثانوي', jo_sec2: 'الصف الثاني الثانوي (التوجيهي)',
            ae_sec3: 'الصف الثاني عشر (الثانوية العامة)', iq_sec6: 'الصف السادس الإعدادي', kw_sec3: 'الصف الثاني عشر الثانوي'
        };

        if (!isLoggedIn || !email) {
            container.innerHTML = `
                <div class="not-logged">
                    <h2>⚠️ يرجى تسجيل الدخول أولاً لعرض لوحة التحكم</h2>
                    <p>تابع تقدمك الدراسي، نقاطك المتراكمة، وسجل اختباراتك الفورية معنا.</p>
                    <a href="index.html" class="btn-main">الذهاب لصفحة تسجيل الدخول</a>
                </div>
            `;
        } else {
            const safeKey = email.replace(/[.#$[\]]/g, '_');
            const userRef = db.ref('users/' + safeKey);

            userRef.on('value', (snapshot) => {
                const userData = snapshot.val() || { points: 200, quizzes: {} };
                const points = userData.points || 200;
                const quizzes = userData.quizzes || {};

                let quizzesRows = '';
                const quizKeys = Object.keys(quizzes);
                if (quizKeys.length === 0) {
                    quizzesRows = `<tr><td colspan="3" style="text-align: center; color: var(--text-muted);">لم تقم بحل أي اختبارات بعد. توجه إلى صفحة المسارات وابدأ الآن!</td></tr>`;
                } else {
                    quizKeys.forEach(qKey => {
                        const q = quizzes[qKey];
                        quizzesRows += `
                            <tr>
                                <td>${q.title}</td>
                                <td><span style="color: var(--abwaab-green); font-weight: 800;">${q.result}</span></td>
                                <td>${q.date || 'اليوم'}</td>
                            </tr>
                        `;
                    });
                }

                container.innerHTML = `
                    <div class="profile-banner">
                        <div class="profile-info">
                            <h1>مرحباً بك، ${name || 'طالبنا المميز'} 👋</h1>
                            <p>أنت تسير بخطى ثابتة نحو التفوق الدراسي. تابع إنجازاتك اليومية هنا.</p>
                        </div>
                        <div class="stats-badge-box">
                            <span>إجمالي النقاط</span>
                            <strong>⭐ ${points}</strong>
                        </div>
                    </div>

                    <div class="dashboard-grid">
                        <div class="dash-card">
                            <h3>🎓 معلومات الحساب والمسار</h3>
                            <div class="info-row">
                               <span>البريد الإلكتروني:</span>
                               <span>${email}</span>
                            </div>
                            <div class="info-row">
                               <span>الدولة المختارة:</span>
                               <span>${countryNames[country] || 'جمهورية مصر العربية'}</span>
                            </div>
                            <div class="info-row">
                               <span>الصف الدراسي:</span>
                               <span>${gradeNames[grade] || grade}</span>
                            </div>
                            <button class="btn-refresh" onclick="location.href='courses.html'">تصفح مواد المنهاج والدروس 🚀</button>
                        </div>

                        <div class="dash-card">
                            <h3>📊 ملخص النشاط والأداء</h3>
                            <div class="info-row">
                               <span>الدروس المكتملة:</span>
                               <span>${quizKeys.length} دروس</span>
                            </div>
                            <div class="info-row">
                               <span>معدل حل الاختبارات:</span>
                               <span>${quizKeys.length > 0 ? 'ممتاز (100%)' : 'بانتظار البدء'}</span>
                            </div>
                            <div class="info-row">
                               <span>حالة الحساب:</span>
                               <span style="color: var(--abwaab-green);">نشط وموثق سحابياً</span>
                            </div>
                            <button class="btn-refresh" onclick="location.reload()">تحديث البيانات المباشرة 🔄</button>
                        </div>
                    </div>

                    <div class="dash-card">
                        <h3>📝 سجل الاختبارات الفورية المجتازة</h3>
                        <table class="history-table">
                            <thead>
                                <tr>
                                    <th>اسم الاختبار / الدرس</th>
                                    <th>حالة الاجتياز</th>
                                    <th>تاريخ الإنجاز</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${quizzesRows}
                            </tbody>
                        </table>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
