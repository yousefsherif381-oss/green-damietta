<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة إدارة المدرسة | مدرسة اللغات الرسمية الجديدة</title>
    <!-- خط Cairo المميز -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #1E3A8A;
            --primary-hover: #1E40AF;
            --accent: #0284C7;
            --bg-dark: #0F172A;
            --card-bg: #FFFFFF;
            --text-dark: #0F172A;
            --text-muted: #64748B;
            --border: #CBD5E1;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        
        body {
            background: var(--bg-dark);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
        }

        /* 🔒 نافذة حماية وتسجيل دخول الإدارة الفورية */
        .admin-auth-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 23, 42, 0.96);
            backdrop-filter: blur(12px);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .admin-auth-card {
            background: #FFFFFF;
            border-radius: 24px;
            padding: 35px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
            text-align: right;
        }

        /* السلايدر الجانبي لوظائف الإدارة */
        .admin-sidebar {
            width: 280px;
            background: #1E293B;
            height: 100vh;
            position: fixed;
            top: 0; right: 0;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            border-left: 1px solid rgba(255,255,255,0.1);
            z-index: 100;
        }

        .admin-sidebar-header {
            padding-bottom: 20px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.15);
            text-align: center;
            color: white;
        }

        .admin-menu { display: flex; flex-direction: column; gap: 10px; flex: 1; }
        .admin-menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 12px;
            color: #CBD5E1;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            background: rgba(255, 255, 255, 0.05);
        }
        .admin-menu-item:hover, .admin-menu-item.active {
            background: #2563EB;
            color: white;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .btn-logout-admin {
            margin-top: auto;
            background: #EF4444;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
            width: 100%;
        }

        /* المحتوى الرئيسي */
        .admin-main-content {
            margin-right: 280px;
            flex: 1;
            padding: 30px;
            max-width: 1100px;
        }

        .admin-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
            margin-bottom: 25px;
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .admin-card.active-tab { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .admin-section-header {
            font-size: 18px;
            font-weight: 900;
            color: var(--primary);
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #E2E8F0;
        }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
        .form-group { margin-bottom: 16px; text-align: right; }
        .form-group label { display: block; font-size: 13px; font-weight: 800; color: #334155; margin-bottom: 6px; }
        .form-control {
            width: 100%; padding: 12px; border: 2px solid var(--border);
            border-radius: 12px; font-size: 14px; font-weight: 600; outline: none; background: #FFFFFF;
        }

        .btn-primary-admin {
            background: #2563EB; color: white; border: none; padding: 12px 24px;
            border-radius: 12px; font-size: 14.5px; font-weight: 800; cursor: pointer;
        }

        .news-item-row {
            background: #F8FAFC;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

    <!-- 🔒 شاشة القفل وتسجيل دخول الإدارة الفورية -->
    <div class="admin-auth-overlay" id="adminAuthOverlay">
        <div class="admin-auth-card">
            <div style="text-align: center; margin-bottom: 15px;">
                <span style="font-size: 40px;">🔐</span>
