<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شؤون الطلاب - تسجيل ومتابعة الغياب | بوابة التعلم الذكي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #0284C7;
            --primary-dark: #0369A1;
            --accent: #F59E0B;
            --accent-hover: #D97706;
            --danger: #EF4444;
            --success: #10B981;
            --card-bg: rgba(255, 255, 255, 0.88);
            --text-dark: #0F172A;
            --text-muted: #64748B;
            --border: rgba(255, 255, 255, 0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }

        body {
            background: linear-gradient(-45deg, #0284C7, #0F172A, #0369A1, #0C4A6E);
            background-size: 400% 400%;
            animation: oceanWaves 16s ease infinite;
            min-height: 100vh;
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        @keyframes oceanWaves {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        header {
            background: rgba(12, 74, 110, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            position: sticky; top: 0; z-index: 100;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
        }

        .nav-container {
            max-width: 1300px; margin: auto; padding: 12px 20px;
            display: flex; justify-content: space-between; align-items: center; gap: 15px; flex-wrap: wrap;
        }

        .logo-area { display: flex; align-items: center; gap: 12px; text-decoration: none; cursor: pointer; margin: auto; }
        .logo-box {
            width: 52px; height: 52px; border-radius: 50%; background: #0F172A; padding: 2px;
            border: 2px solid var(--accent); box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0;
        }
        .logo-box img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
        .logo-text { font-size: 19px; font-weight: 900; color: #FFFFFF; text-shadow: 0 2px 4px rgba(0,0,0,0.4); }

        .btn-header-home {
            background: var(--accent); color: #fff; border: none; padding: 9px 18px;
            border-radius: 12px; font-size: 13.5px; font-weight: 800; cursor: pointer;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.35); transition: all 0.3s ease;
        }
        .btn-header-home:hover { background: var(--accent-hover); transform: translateY(-2px); }

        .main-wrapper { max-width: 1250px; width: 100%; margin: 30px auto; padding: 0 20px; flex: 1; }

        .admin-section {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 24px; padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2); 
            margin-bottom: 25px;
            border-top: 5px solid var(--accent);
        }
        .card-title { font-size: 18px; font-weight: 900; color: var(--primary-dark); margin-bottom: 20px; }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 16px; }
        .form-control {
            width: 100%; padding: 12px 14px; border: 1.5px solid var(--border);
            border-radius: 12px; font-size: 14px; font-weight: 600; outline: none; background: #FFFFFF;
            transition: all 0.3s ease;
        }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15); }

        .btn { padding: 10px 18px; border-radius: 12px; border: none; font-weight: 800; font-size: 13.5px; cursor: pointer; transition: all 0.25s ease; }
        .btn:hover { transform: translateY(-2px); }
        .btn-success { background: var(--success); color: white; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; text-align: right; font-size: 13px; background: #FFFFFF; border-radius: 12px; overflow: hidden; }
        th, td { padding: 12px 14px; border: 1px solid var(--border); }
        th { background: #0284C7; color: #FFFFFF; font-weight: 800; }
        tr:nth-child(even) { background-color: #F8FAFC; }

        .custom-toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px);
            background: #0F172A; color: white; padding: 16px 28px; border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); border: 2px solid var(--accent);
            display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 14.5px;
            z-index: 4000; opacity: 0; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); pointer-events: none;
        }
        .custom-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>

    <div id="customToast" class="custom-toast">
        <span id="toastIcon">✨</span>
        <span id="toastMessage">تمت العملية بنجاح</span>
    </div>

    <header>
        <div class="nav-container">
            <div class="logo-area" onclick="window.location.href='index.html'">
                <div class="logo-box">
                    <img src="https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?w=150&auto=format&fit=crop&q=80" alt="شعار بوابة التعلم الذكي">
                </div>
                <span class="logo-text">شؤون الطلاب - تسجيل ومتابعة الغياب</span>
            </div>
            <button onclick="window.location.href='index.html'" class="btn-header-home">العودة للموقع الرئيسي ➡️</button>
        </div>
    </header>

    <main class="main-wrapper">

        <!-- قسم تسجيل وحساب الغياب لشؤون الطلاب -->
        <div class="admin-section">
            <div class="card-title">📅 سجل وحساب عداد الغياب والأعذار الطبية والاحترازية</div>
            <div style="background: rgba(248, 250, 252, 0.9); padding: 20px; border-radius: 18px; border: 1px solid var(--border);">
                <div class="form-grid" style="grid-template-columns: 1fr 1fr; gap: 15px; align-items: center;">
                    <div>
                        <label style="font-weight: 700; font-size: 13px; display: block; margin-bottom: 6px;">اختر الطالب:</label>
                        <select id="studentAttendanceSelect" class="form-control" onchange="loadStudentAttendanceData()">
                            <option value="">-- اختر طالب من القائمة --</option>
                        </select>
                    </div>
                    <div>
                        <label style="font-weight: 700; font-size: 13px; display: block; margin-bottom: 6px;">حالة الحضور والغياب:</label>
                        <select id="attendanceStatusSelect" class="form-control" onchange="onAttendanceStatusChange()">
                            <option value="منتظم">منتظم (حاضر) ✅</option>
                            <option value="غاب يوم واحد">غاب يوم واحد ❌</option>
                            <option value="عذر مرضي / تقرير طبي">عذر مرضي / تقرير طبي 🏥</option>
                            <option value="استئذان رسمي">استئذان رسمي ⚠️</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-grid" style="grid-template-columns: 1fr 2fr; gap: 15px; margin-top: 15px; align-items: center;">
                    <div>
                        <label style="font-weight: 700; font-size: 13px; display: block; margin-bottom: 6px;">🔢 إجمالي عدد مرات الغياب:</label>
                        <input type="number" id="absenceCountInput" class="form-control" value="0" min="0" placeholder="0">
                    </div>
                    <div>
                        <label style="font-weight: 700; font-size: 13px; display: block; margin-bottom: 6px;">📝 ملاحظات أو سبب العذر:</label>
                        <input type="text" id="attendanceNoteInput" class="form-control" placeholder="مثال: غياب بعذر أو تقرير رقم 123...">
                    </div>
                </div>

                <div style="margin-top: 15px;">
                    <label style="font-weight: 700; font-size: 13px; display: block; margin-bottom: 6px;">📅 تواريخ أيام الغياب تفصيلياً (اليوم، الشهر، السبب):</label>
                    <textarea id="absenceDatesLogInput" class="form-control" rows="3" placeholder="مثال:
- 12 أكتوبر: عذر مرضي
- 18 أكتوبر: غياب بدون عذر
- 25 نوفمبر: استئذان رسمي"></textarea>
                </div>

                <button onclick="saveStudentAttendance()" class="btn btn-success" style="width: 100%; margin-top: 15px;">تحديث عداد وسجل الحضور بدقة 💾</button>
            </div>
        </div>

        <!-- جدول متابعة الطلاب وسجل الغياب العام -->
        <div class="admin-section">
            <div class="card-title">👥 سجل الطلاب وحالات الغياب المسجلة</div>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>اسم الطالب</th>
                            <th>الصف الدراسي</th>
                            <th>الكود / الرقم القومي</th>
                            <th>حالة الحضور</th>
                            <th>مرات الغياب</th>
                            <th>تفاصيل العذر والملاحظة</th>
                        </tr>
                    </thead>
                    <tbody id="adminUsersTableBody">
                        <tr><td colspan="6" style="text-align: center;">جاري تحميل بيانات الطلاب...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script>
        const firebaseConfig = { databaseURL: "https://green-damietta-b0a29-default-rtdb.firebaseio.com" };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();

        let allUsersData = {};
        let selectedStudentKey = null;

        function showToast(message, icon = "✨") {
            const toast = document.getElementById('customToast');
            document.getElementById('toastIcon').textContent = icon;
            document.getElementById('toastMessage').textContent = message;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }

        // جلب بيانات الطلاب لعرضها في القائمة والجدول
        function fetchStudentsForAttendance() {
            db.ref('users').on('value', (snapshot) => {
                const data = snapshot.val();
                const studentSelect = document.getElementById('studentAttendanceSelect');
                const tableBody = document.getElementById('adminUsersTableBody');
                
                studentSelect.innerHTML = '<option value="">-- اختر طالب من القائمة --</option>';
                tableBody.innerHTML = '';

                if (!data) {
                    tableBody.innerHTML = '<tr><td colspan="6" style="text-align: center;">لا توجد بيانات مسجلة بعد</td></tr>';
                    return;
                }

                allUsersData = data;

                Object.keys(data).forEach(key => {
                    const user = data[key];
                    if (user.role === 'student' || !user.role) {
                        // إضافة للقائمة المنسدلة
                        const opt = document.createElement('option');
                        opt.value = key;
                        opt.textContent = `${user.fullName || user.name || 'بدون اسم'} (${user.grade || 'غير محدد'})`;
                        studentSelect.appendChild(opt);

                        // إضافة للجدول
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td><b>${user.fullName || user.name || '---'}</b></td>
                            <td>${user.grade || '---'}</td>
                            <td>${user.nationalId || user.code || '---'}</td>
                            <td><span style="padding: 4px 10px; border-radius: 8px; font-weight: bold; background: ${user.attendanceStatus === 'منتظم' ? '#E6F4EA' : '#FCE8E6'}; color: ${user.attendanceStatus === 'منتظم' ? '#137333' : '#C5221F'};">${user.attendanceStatus || 'منتظم'}</span></td>
                            <td><b>${user.absenceCount || 0}</b></td>
                            <td>${user.attendanceNote || 'لا توجد ملاحظات'}</td>
                        `;
                        tableBody.appendChild(tr);
                    }
                });
            });
        }

        // عند اختيار طالب من القائمة لتعديل غيابه
        function loadStudentAttendanceData() {
            const key = document.getElementById('studentAttendanceSelect').value;
            selectedStudentKey = key;
            if (!key || !allUsersData[key]) return;

            const user = allUsersData[key];
            document.getElementById('attendanceStatusSelect').value = user.attendanceStatus || 'منتظم';
            document.getElementById('absenceCountInput').value = user.absenceCount || 0;
            document.getElementById('attendanceNoteInput').value = user.attendanceNote || '';
            document.getElementById('absenceDatesLogInput').value = user.absenceDatesLog || '';
        }

        // تحديث عدد الغياب تلقائياً بناءً على الحالة المختارة
        function onAttendanceStatusChange() {
            const status = document.getElementById('attendanceStatusSelect').value;
            const absenceInput = document.getElementById('absenceCountInput');
            if (status === 'غاب يوم واحد') {
                absenceInput.value = parseInt(absenceInput.value || 0) + 1;
            }
        }

        // حفظ بيانات الغياب والحضور للطالب المحدد في قاعدة البيانات
        function saveStudentAttendance() {
            if (!selectedStudentKey) {
                showToast('الرجاء اختيار الطالب أولاً ⚠️', '❌');
                return;
            }

            const attendanceStatus = document.getElementById('attendanceStatusSelect').value;
            const absenceCount = parseInt(document.getElementById('absenceCountInput').value) || 0;
            const attendanceNote = document.getElementById('attendanceNoteInput').value.trim();
            const absenceDatesLog = document.getElementById('absenceDatesLogInput').value.trim();

            db.ref(`users/${selectedStudentKey}`).update({
                attendanceStatus,
                absenceCount,
                attendanceNote,
                absenceDatesLog
            }).then(() => {
                showToast('تم تحديث سجل الغياب بنجاح 📅', '✅');
            }).catch(error => {
                showToast('حدث خطأ أثناء الحفظ ❌', '⚠️');
            });
        }

        window.onload = function() {
            fetchStudentsForAttendance();
        };
    </script>
</body>
</html>
