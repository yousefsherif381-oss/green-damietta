<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الإدارية | بوابة التعلم الذكي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #0284C7;
            --primary-dark: #0369A1;
            --accent: #F59E0B;
            --accent-hover: #D97706;
            --card-bg: #FFFFFF;
            --text-dark: #0F172A;
            --text-muted: #64748B;
            --border: #CBD5E1;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        
        body {
            background: linear-gradient(-45deg, #0284C7, #0F172A, #0369A1, #0C4A6E);
            background-size: 400% 400%;
            animation: oceanWaves 16s ease infinite;
            min-height: 100vh;
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
        }

        @keyframes oceanWaves {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        header {
            background: rgba(12, 74, 110, 0.92);
            backdrop-filter: blur(16px);
            border-bottom: 2px solid rgba(245, 158, 11, 0.4);
            position: sticky; top: 0; z-index: 100;
            padding: 12px 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .nav-container {
            max-width: 1200px; margin: auto;
            display: flex; justify-content: space-between; align-items: center;
        }

        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo-box {
            width: 48px; height: 48px; border-radius: 50%; background: #0f172a;
            padding: 2px; border: 2.5px solid var(--accent); display: flex;
            align-items: center; justify-content: center; overflow: hidden;
        }
        .logo-box img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
        
        .logo-text {
            font-size: 20px; font-weight: 900; color: #FFFFFF;
            background: linear-gradient(45deg, #FFFFFF, #38BDF8);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .btn-header {
            padding: 8px 18px; border-radius: 10px; font-size: 13.5px;
            font-weight: 800; cursor: pointer; border: none; transition: all 0.3s ease;
            background: #EF4444; color: white;
        }

        .main-wrapper { max-width: 1000px; width: 100%; margin: 30px auto; padding: 0 16px; flex: 1; }

        .admin-card {
            background: var(--card-bg); border-radius: 20px; padding: 28px;
            box-shadow: var(--shadow); margin-bottom: 25px;
        }

        .admin-title {
            font-size: 20px; font-weight: 800; color: var(--primary-dark);
            margin-bottom: 20px; border-bottom: 2px solid #F1F5F9; padding-bottom: 10px;
        }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
        .form-group { margin-bottom: 16px; text-align: right; }
        .form-group label { display: block; font-size: 13.5px; font-weight: 700; color: #475569; margin-bottom: 8px; }
        .form-control {
            width: 100%; padding: 11px 14px; border: 1.5px solid var(--border);
            border-radius: 10px; font-size: 14px; font-weight: 600; outline: none; background: #FFFFFF;
        }

        /* تنسيق أزرار رفع الملفات المخصصة */
        input[type="file"] { display: none; }

        .custom-file-upload {
            display: inline-flex; align-items: center; justify-content: center;
            gap: 10px; width: 100%; padding: 12px 18px; background: #F8FAFC;
            border: 2px dashed var(--primary); border-radius: 12px;
            color: var(--primary-dark); font-weight: 700; font-size: 14px;
            cursor: pointer; transition: all 0.3s ease; text-align: center;
        }

        .custom-file-upload:hover {
            background: #E0F2FE; border-color: var(--accent); transform: translateY(-2px);
        }

        .file-name-preview {
            display: block; font-size: 12.5px; color: var(--text-muted);
            margin-top: 6px; font-weight: 600;
        }

        .btn-submit {
            width: 100%; padding: 13px; background: var(--primary); color: white;
            border: none; border-radius: 10px; font-size: 15px; font-weight: 800; cursor: pointer; margin-top: 10px;
        }

        .subject-box {
            background: #F8FAFC; border: 1px solid var(--border); border-radius: 12px;
            padding: 16px; margin-bottom: 14px;
        }
        .subject-title { font-size: 15px; font-weight: 800; color: var(--primary); margin-bottom: 10px; }

        .ticket-item {
            background: #F8FAFC; border-right: 4px solid var(--accent);
            padding: 16px; border-radius: 12px; margin-bottom: 12px; border-top: 1px solid var(--border);
        }

        .custom-toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px);
            background: #0F172A; color: white; padding: 12px 24px; border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); border: 1px solid var(--accent);
            display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 13.5px;
            z-index: 2000; opacity: 0; transition: all 0.3s ease; pointer-events: none;
        }
        .custom-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>

    <div id="customToast" class="custom-toast">
        <span id="toastIcon">✨</span>
        <span id="toastMessage">تمت العملية بنجاح</span>
    </div>

    <header>
        <div class="nav-container">
            <div class="logo-area">
                <div class="logo-box">
                    <img src="https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?w=150&auto=format&fit=crop&q=80" alt="شعار النظام">
                </div>
                <span class="logo-text">بوابة التعلم الذكي - الإدارة</span>
            </div>
            <button onclick="window.location.href='index.html'" class="btn-header">خروج 🚪</button>
        </div>
    </header>

    <main class="main-wrapper">
        
        <!-- 1️⃣ قسم نشر الإعلانات والأخبار -->
        <div class="admin-card">
            <h2 class="admin-title">📢 نشر خبر أو إعلان جديد</h2>
            <form onsubmit="publishNews(event)">
                <div class="form-group">
                    <label>عنوان الإعلان</label>
                    <input type="text" id="newsTitleInput" class="form-control" placeholder="أدخل عنوان الخبر..." required>
                </div>
                <div class="form-group">
                    <label>وسام الإعلان (اختياري)</label>
                    <input type="text" id="newsBadgeInput" class="form-control" placeholder="مثال: هام جداً / عاجل / تنبيه">
                </div>
                <div class="form-group">
                    <label>محتوى الإعلان</label>
                    <textarea id="newsContentInput" class="form-control" rows="3" placeholder="اكتب تفاصيل الإعلان هنا..." required></textarea>
                </div>

                <div class="form-group">
                    <label>🖼️ إرفاق صورة الإعلان (اختياري):</label>
                    <label for="newsImageInput" class="custom-file-upload">
                        <span>📁 اضغط لاختيار صورة الإعلان</span>
                    </label>
                    <input type="file" id="newsImageInput" accept="image/*" onchange="updateFileName(this, 'imageNamePreview')">
                    <span id="imageNamePreview" class="file-name-preview">لم يتم اختيار ملف بعد</span>
                </div>

                <div class="form-group">
                    <label>🎥 أو إرفاق فيديو صغير من الجهاز:</label>
                    <label for="newsVideoInput" class="custom-file-upload">
                        <span>🎬 اضغط لاختيار فيديو الإعلان</span>
                    </label>
                    <input type="file" id="newsVideoInput" accept="video/*" onchange="updateFileName(this, 'videoNamePreview')">
                    <span id="videoNamePreview" class="file-name-preview">لم يتم اختيار ملف بعد</span>
                </div>

                <button type="submit" class="btn-submit">نشر الإعلان الآن 🚀</button>
            </form>
        </div>

        <!-- 2️⃣ قسم رصد درجات الطلاب -->
        <div class="admin-card">
            <h2 class="admin-title">📊 رصد درجات الطلاب</h2>
            <div class="form-group">
                <label>اختر الطالب لرصد الدرجات</label>
                <select id="studentSelectForGrades" class="form-control" onchange="loadStudentGradesForAdmin(this.value)">
                    <option value="">-- اختر الطالب --</option>
                </select>
            </div>

            <div id="gradesInputsContainer" style="display: none; margin-top: 20px;">
                <form onsubmit="saveStudentGrades(event)">
                    <div id="dynamicSubjectsArea"></div>
                    <button type="submit" class="btn-submit" style="background: var(--accent);">حفظ كل الدرجات 💾</button>
                </form>
            </div>
        </div>

        <!-- 3️⃣ قسم الحضور والغياب -->
        <div class="admin-card">
            <h2 class="admin-title">📅 سجل حضور وغياب الطلاب</h2>
            <div class="form-group">
                <label>اختر الطالب</label>
                <select id="studentSelectForAttendance" class="form-control" onchange="loadStudentAttendanceForAdmin(this.value)">
                    <option value="">-- اختر الطالب --</option>
                </select>
            </div>

            <form id="attendanceForm" onsubmit="saveStudentAttendance(event)" style="display: none; margin-top: 15px;">
                <div class="form-group">
                    <label>حالة الحضور</label>
                    <select id="attendanceStatusSelect" class="form-control">
                        <option value="منتظم 🟢">منتظم 🟢</option>
                        <option value="غائب 🔴">غائب 🔴</option>
                        <option value="مستأذن 🟡">مستأذن 🟡</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>ملاحظة غياب أو تأخير (اختياري)</label>
                    <input type="text" id="attendanceNoteInput" class="form-control" placeholder="اكتب السبب إن وجد...">
                </div>
                <button type="submit" class="btn-submit">حفظ حالة الحضور 💾</button>
            </form>
        </div>

        <!-- 4️⃣ قسم الشكاوى والتواصل -->
        <div class="admin-card">
            <h2 class="admin-title">📨 شكاوى واستفسارات أولياء الأمور</h2>
            <div id="ticketsListContainer">
                <p style="color: gray; text-align: center;">جاري تحميل الشكاوى...</p>
            </div>
        </div>

        <!-- 5️⃣ قسم تغيير كلمة مرور الأدمن -->
        <div class="admin-card">
            <h2 class="admin-title">🔑 تغيير كلمة مرور الإدارة</h2>
            <form onsubmit="changeAdminPassword(event)">
                <div class="form-group">
                    <label>كلمة المرور الجديدة</label>
                    <input type="password" id="newAdminPasswordInput" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-submit" style="background: var(--accent);">حفظ كلمة المرور الجديدة 💾</button>
            </form>
        </div>

    </main>

    <script>
        const firebaseConfig = { databaseURL: "https://green-damietta-b0a29-default-rtdb.firebaseio.com" };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();

        let allStudentsData = {};
        let selectedStudentKey = null;

        const gradeSubjectsDetailed = {
            lowerPrimary: [
                { id: 'ar', name: 'اللغة العربية' },
                { id: 'en', name: 'اللغة الإنجليزية' },
                { id: 'math', name: 'الرياضيات Math' },
                { id: 'discover', name: 'Discover / اكتشف' },
                { id: 'religion', name: 'التربية الدينية' }
            ],
            upperPrimary: [
                { id: 'ar', name: 'اللغة العربية' },
                { id: 'en', name: 'اللغة الإنجليزية' },
                { id: 'math', name: 'الرياضيات Math' },
                { id: 'science', name: 'العلوم Science' },
                { id: 'social', name: 'الدراسات الاجتماعية' },
                { id: 'ict', name: 'تكنولوجيا المعلومات ICT' },
                { id: 'skills', name: 'المهارات المهنية' },
                { id: 'religion', name: 'التربية الدينية' }
            ],
            prep: [
                { id: 'ar', name: 'اللغة العربية' },
                { id: 'en', name: 'اللغة الإنجليزية' },
                { id: 'math', name: 'الرياضيات Math' },
                { id: 'science', name: 'العلوم Science' },
                { id: 'social', name: 'الدراسات الاجتماعية' },
                { id: 'computer', name: 'الحاسب الآلي' },
                { id: 'religion', name: 'التربية الدينية' }
            ]
        };

        function getSubjectsForGradeName(gradeName) {
            if (!gradeName) return gradeSubjectsDetailed.lowerPrimary;
            if (gradeName.includes('الإعدادي') || gradeName.includes('اعدادي')) return gradeSubjectsDetailed.prep;
            else if (gradeName.includes('الرابع') || gradeName.includes('الخامس') || gradeName.includes('السادس')) return gradeSubjectsDetailed.upperPrimary;
            else return gradeSubjectsDetailed.lowerPrimary;
        }

        function showToast(message, icon = "✨") {
            const toast = document.getElementById('customToast');
            document.getElementById('toastIcon').textContent = icon;
            document.getElementById('toastMessage').textContent = message;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }

        function updateFileName(input, previewId) {
            const previewSpan = document.getElementById(previewId);
            if (input.files && input.files[0]) {
                previewSpan.textContent = '✅ تم اختيار: ' + input.files[0].name;
                previewSpan.style.color = '#16A34A';
            } else {
                previewSpan.textContent = 'لم يتم اختيار ملف بعد';
                previewSpan.style.color = '#64748B';
            }
        }

        // تحميل قائمة الطلاب
        db.ref('students').on('value', (snapshot) => {
            allStudentsData = snapshot.val() || {};
            const gradesSelect = document.getElementById('studentSelectForGrades');
            const attendanceSelect = document.getElementById('studentSelectForAttendance');
            
            gradesSelect.innerHTML = '<option value="">-- اختر الطالب --</option>';
            attendanceSelect.innerHTML = '<option value="">-- اختر الطالب --</option>';

            Object.keys(allStudentsData).forEach(key => {
                const s = allStudentsData[key];
                const opt = `<option value="${key}">${s.name} (${s.grade || 'غير محدد'})</option>`;
                gradesSelect.innerHTML += opt;
                attendanceSelect.innerHTML += opt;
            });
        });

        // رصد الدرجات
        function loadStudentGradesForAdmin(key) {
            selectedStudentKey = key;
            const container = document.getElementById('gradesInputsContainer');
            const area = document.getElementById('dynamicSubjectsArea');
            if (!key) { container.style.display = 'none'; return; }

            const student = allStudentsData[key];
            const subjects = getSubjectsForGradeName(student.grade);
            area.innerHTML = '';

            subjects.forEach(sub => {
                area.innerHTML += `
                    <div class="subject-box">
                        <div class="subject-title">📚 ${sub.name}</div>
                        <div class="form-grid">
                            <div class="form-group"><label>أعمال السنة</label><input type="number" id="${sub.id}_work" class="form-control" value="${student[sub.id + '_work'] || 0}"></div>
                            <div class="form-group"><label>التقييم الأسبوعي</label><input type="number" id="${sub.id}_weekly" class="form-control" value="${student[sub.id + '_weekly'] || 0}"></div>
                            <div class="form-group"><label>الامتحان النهائي</label><input type="number" id="${sub.id}_final" class="form-control" value="${student[sub.id + '_final'] || 0}"></div>
                        </div>
                    </div>
                `;
            });
            container.style.display = 'block';
        }

        function saveStudentGrades(e) {
            e.preventDefault();
            if (!selectedStudentKey) return;
            const student = allStudentsData[selectedStudentKey];
            const subjects = getSubjectsForGradeName(student.grade);
            let updates = {};

            subjects.forEach(sub => {
                updates[sub.id + '_work'] = document.getElementById(sub.id + '_work').value;
                updates[sub.id + '_weekly'] = document.getElementById(sub.id + '_weekly').value;
                updates[sub.id + '_final'] = document.getElementById(sub.id + '_final').value;
            });

            db.ref('students/' + selectedStudentKey).update(updates).then(() => {
                showToast('تم حفظ درجات الطالب بنجاح! 💾');
            });
        }

        // الحضور والغياب
        function loadStudentAttendanceForAdmin(key) {
            const form = document.getElementById('attendanceForm');
            if (!key) { form.style.display = 'none'; return; }
            const s = allStudentsData[key];
            document.getElementById('attendanceStatusSelect').value = s.attendance || 'منتظم 🟢';
            document.getElementById('attendanceNoteInput').value = s.attendanceNote || '';
            form.style.display = 'block';
        }

        function saveStudentAttendance(e) {
            e.preventDefault();
            const key = document.getElementById('studentSelectForAttendance').value;
            if (!key) return;
            db.ref('students/' + key).update({
                attendance: document.getElementById('attendanceStatusSelect').value,
                attendanceNote: document.getElementById('attendanceNoteInput').value.trim()
            }).then(() => {
                showToast('تم تحديث حالة الحضور! 📅');
            });
        }

        // الشكاوى
        db.ref('tickets').on('value', (snapshot) => {
            const container = document.getElementById('ticketsListContainer');
            container.innerHTML = '';
            const data = snapshot.val();
            if (data) {
                Object.keys(data).reverse().forEach(k => {
                    const t = data[k];
                    container.innerHTML += `
                        <div class="ticket-item">
                            <h4 style="color: var(--primary-dark);">👤 ${t.parentName || 'ولي أمر'} <small style="color:gray;">(${t.contact || ''})</small></h4>
                            <p style="margin-top:6px; font-weight:600;">${t.content || ''}</p>
                            <small style="color: gray; display:block; margin-top:6px;">📅 ${t.date || ''}</small>
                        </div>
                    `;
                });
            } else {
                container.innerHTML = '<p style="color: gray; text-align: center;">لا توجد شكاوى مسجلة حالياً.</p>';
            }
        });

        // نشر الإعلانات
        function publishNews(e) {
            e.preventDefault();
            const title = document.getElementById('newsTitleInput').value.trim();
            const badge = document.getElementById('newsBadgeInput').value.trim();
            const content = document.getElementById('newsContentInput').value.trim();
            const imageInput = document.getElementById('newsImageInput');
            const videoInput = document.getElementById('newsVideoInput');

            const newsKey = 'news_' + Date.now();

            const processPublish = (imageData, videoData) => {
                db.ref('news/' + newsKey).set({
                    title, badge, content,
                    image: imageData || '',
                    video: videoData || '',
                    timestamp: Date.now()
                }).then(() => {
                    showToast('تم نشر الإعلان بنجاح! 🚀');
                    document.getElementById('newsTitleInput').value = '';
                    document.getElementById('newsBadgeInput').value = '';
                    document.getElementById('newsContentInput').value = '';
                    imageInput.value = ''; videoInput.value = '';
                    document.getElementById('imageNamePreview').textContent = 'لم يتم اختيار ملف بعد';
                    document.getElementById('imageNamePreview').style.color = '#64748B';
                    document.getElementById('videoNamePreview').textContent = 'لم يتم اختيار ملف بعد';
                    document.getElementById('videoNamePreview').style.color = '#64748B';
                });
            };

            const readImage = new Promise((resolve) => {
                if (imageInput.files[0]) {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result);
                    reader.readAsDataURL(imageInput.files[0]);
                } else resolve('');
            });

            const readVideo = new Promise((resolve) => {
                if (videoInput.files[0]) {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result);
                    reader.readAsDataURL(videoInput.files[0]);
                } else resolve('');
            });

            Promise.all([readImage, readVideo]).then(([img, vid]) => {
                processPublish(img, vid);
            });
        }

        // تغيير باسورد الأدمن
        function changeAdminPassword(e) {
            e.preventDefault();
            const newPass = document.getElementById('newAdminPasswordInput').value.trim();
            db.ref('settings/adminPassword').set(newPass).then(() => {
                showToast('تم تحديث كلمة مرور الأدمن بنجاح! 🔑');
                document.getElementById('newAdminPasswordInput').value = '';
            });
        }
    </script>
</body>
</html>
