<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم والإدارة | مدرسة اللغات الرسمية الجديدة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #1E3A8A;
            --bg: #0F172A;
            --card-bg: #FFFFFF;
            --text-dark: #0F172A;
            --border: #CBD5E1;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background: var(--bg); color: var(--text-dark); padding: 20px; }
        .admin-container { max-width: 1000px; margin: auto; }
        
        .header-admin {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            padding: 20px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .card-admin {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; font-weight: 800; margin-bottom: 6px; }
        .form-control {
            width: 100%; padding: 12px; border: 2px solid var(--border);
            border-radius: 10px; font-size: 14px; font-weight: 600; outline: none;
        }

        .btn-post {
            background: #2563EB; color: white; border: none; padding: 12px 24px;
            border-radius: 10px; font-size: 14px; font-weight: 800; cursor: pointer;
        }
        .btn-delete {
            background: #EF4444; color: white; border: none; padding: 6px 12px;
            border-radius: 8px; font-size: 12px; font-weight: 800; cursor: pointer;
        }

        .news-admin-item {
            background: #F8FAFC;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <div class="header-admin">
            <div>
                <h2>🔐 لوحة إدارة المدرسة البوابية</h2>
                <p style="font-size: 13px; opacity: 0.8;">التحكم بالنشر والإعلانات وإدارة الحسابات</p>
            </div>
            <button onclick="window.location.href='index.html'" style="background: rgba(255,255,255,0.2); color: white; border: none; padding: 8px 16px; border-radius: 10px; cursor: pointer; font-weight: bold;">العودة للموقع ⬅️</button>
        </div>

        <!-- إضافة خبر جديد -->
        <div class="card-admin">
            <h3 style="margin-bottom: 15px; color: var(--primary);">📢 إضافة خبر / إعلان جديد للموقع الرئيسي</h3>
            <form onsubmit="publishNews(event)">
                <div class="form-group">
                    <label>عنوان الإعلان أو الخبر</label>
                    <input type="text" id="newsTitle" class="form-control" placeholder="مثال: جدول امتحانات الشهر القادم" required>
                </div>
                <div class="form-group">
                    <label>نوع التنبيه</label>
                    <select id="newsBadge" class="form-control">
                        <option value="تنبيه مدرسي">تنبيه مدرسي</option>
                        <option value="جدول الامتحانات">جدول الامتحانات</option>
                        <option value="التقييمات الأسبوعية">التقييمات الأسبوعية</option>
                        <option value="نشاط مدرسي">نشاط مدرسي</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>تفاصيل الخبر أو الإعلان</label>
                    <textarea id="newsContent" class="form-control" rows="4" placeholder="اكتب التفاصيل والإرشادات الموجهة لأولياء الأمور والطلاب..." required></textarea>
                </div>
                <button type="submit" class="btn-post">نشر الإعلان فوراً 🚀</button>
            </form>
        </div>

        <!-- الأرشيف والتحكم بالأخبار المطبوعة -->
        <div class="card-admin">
            <h3 style="margin-bottom: 15px; color: var(--primary);">📑 إدارة الأخبار والإعلانات المنشورة</h3>
            <div id="adminNewsFeed">
                <p style="color: #64748B;">جاري جلب الإعلانات...</p>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAE995CZXAe212KXhrlQjyY2Nw2SCfw8WA",
            authDomain: "green-damietta-b0a29.firebaseapp.com",
            databaseURL: "https://green-damietta-b0a29-default-rtdb.firebaseio.com",
            projectId: "green-damietta-b0a29",
            storageBucket: "green-damietta-b0a29.firebasestorage.app",
            messagingSenderId: "210935345765",
            appId: "1:210935345765:web:53ba42e2116f8e432bcc8c",
            measurementId: "G-CT9KYEKXML"
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();

        window.addEventListener('DOMContentLoaded', () => {
            loadAdminNews();
        });

        async function publishNews(e) {
            e.preventDefault();
            const title = document.getElementById('newsTitle').value.trim();
            const badge = document.getElementById('newsBadge').value;
            const content = document.getElementById('newsContent').value.trim();

            const newRef = db.ref('news').push();
            await newRef.set({
                title,
                badge,
                content,
                timestamp: Date.now()
            });

            document.getElementById('newsTitle').value = '';
            document.getElementById('newsContent').value = '';
            alert('✅ تم نشر الإعلان بنجاح على الواجهة الرئيسية!');
        }

        function loadAdminNews() {
            db.ref('news').on('value', (snapshot) => {
                const container = document.getElementById('adminNewsFeed');
                container.innerHTML = '';
                const data = snapshot.val();

                if (!data) {
                    container.innerHTML = '<p style="color: #64748B;">لا توجد أخبار منشورة حالياً.</p>';
                    return;
                }

                let html = '';
                Object.keys(data).reverse().forEach(key => {
                    const item = data[key];
                    html += `
                        <div class="news-admin-item">
                            <div>
                                <span style="background: #DBEAFE; color: #2563EB; font-size: 11px; font-weight: bold; padding: 2px 8px; border-radius: 6px;">${item.badge}</span>
                                <h4 style="font-size: 15px; margin: 4px 0;">${item.title}</h4>
                                <p style="font-size: 12.5px; color: #475569;">${item.content}</p>
                            </div>
                            <button onclick="deleteNews('${key}')" class="btn-delete">حذف 🗑️</button>
                        </div>
                    `;
                });
                container.innerHTML = html;
            });
        }

        async function deleteNews(key) {
            if (confirm('هل أنت تأكد من رغبتك في حذف هذا الإعلان؟')) {
                await db.ref('news/' + key).remove();
            }
        }
    </script>
</body>
</html>
