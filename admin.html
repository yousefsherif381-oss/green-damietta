<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم والإدارة | مدرسة اللغات الرسمية الجديدة</title>
    <!-- خط Cairo المميز -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #0284C7;
            --primary-dark: #0369A1;
            --accent: #F59E0B;
            --danger: #EF4444;
            --bg-dark: #0F172A;
            --card-bg: #FFFFFF;
            --text-dark: #0F172A;
            --border: #E2E8F0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }

        body {
            background: #F1F5F9;
            min-height: 100vh;
            color: var(--text-dark);
            padding: 20px;
        }

        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .admin-header {
            background: var(--bg-dark);
            color: white;
            padding: 20px;
            border-radius: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .admin-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
        }

        .card-title {
            font-size: 18px;
            font-weight: 900;
            color: var(--primary-dark);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-control {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 13.5px;
            outline: none;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 12px;
            border: none;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-accent { background: var(--accent); color: white; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            text-align: right;
            font-size: 13px;
        }

        th, td { padding: 12px 14px; border: 1px solid var(--border); }
        th { background: #F8FAFC; color: var(--primary-dark); font-weight: 800; }

        /* نافذة البروفايل المكتملة (Modal) */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(5px);
            display: none; justify-content: center; align-items: center; z-index: 1000;
        }

        .modal-box {
            background: white; border-radius: 20px; padding: 25px;
            max-width: 600px; width: 90%; max-height: 90vh; overflow-y: auto;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <!-- الهيدر -->
        <div class="admin-header">
            <div>
                <h2>🔐 لوحة إدارة البوابة المدرسية</h2>
                <p style="font-size: 12px; color: #94A3B8;">مدرسة اللغات الرسمية الجديدة - التحكم الكامل</p>
            </div>
            <button onclick="window.location.href='index.html'" class="btn btn-accent">العودة للموقع ➡️</button>
        </div>

        <!-- قسم إدارة الأخبار -->
        <div class="admin-card">
            <div class="card-title">📢 نشر إعلان أو خبر جديد</div>
            <form onsubmit="postNews(event)">
                <div class="form-grid">
                    <input type="text" id="newsTitle" class="form-control" placeholder="عنوان الخبر" required>
                    <input type="text" id="newsBadge" class="form-control" placeholder="وسم الخبر (مثال: هام جداً)">
                </div>
                <textarea id="newsContent" class="form-control" rows="3" placeholder="تفاصيل الخبر..." required style="margin-bottom: 15px;"></textarea>
                <button type="submit" class="btn btn-primary">نشر الإعلان للجميع 🚀</button>
            </form>
        </div>

        <!-- قسم إدارة الطلاب وأولياء الأمور والبروفايلات -->
        <div class="admin-card">
            <div class="card-title">👥 إدارة الطلاب وأولياء الأمور (البروفايلات)</div>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>الاسم</th>
                            <th>نوع الحساب</th>
                            <th>الصف الدراسي</th>
                            <th>الرقم القومي / الكود</th>
                            <th>الإجراءات والبروفايل</th>
                        </tr>
                    </thead>
                    <tbody id="adminUsersTableBody">
                        <tr><td colspan="5" style="text-align: center;">جاري تحميل البيانات...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- نافذة تعديل واستعراض بروفايل المستخدم -->
    <div class="modal-overlay" id="profileModal">
        <div class="modal-box">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3 style="color: var(--primary-dark);">👤 بروفايل وتعديل بيانات المستخدم</h3>
                <button onclick="closeProfileModal()" style="background: none; border: none; font-size: 20px; cursor: pointer;">✕</button>
            </div>

            <form onsubmit="saveUserProfileByAdmin(event)">
                <input type="hidden" id="modalUserKey">
                
                <div class="form-grid">
                    <div style="grid-column: 1 / -1;">
                        <label style="font-size: 12px; font-weight: bold;">اسم المستخدم / الطالب</label>
                        <input type="text" id="modalName" class="form-control" required>
                    </div>
                    <div>
                        <label style="font-size: 12px; font-weight: bold;">الصف الدراسي</label>
                        <select id="modalGrade" class="form-control">
                            <option value="الصف الأول الابتدائي">الصف الأول الابتدائي</option>
                            <option value="الصف الثاني الابتدائي">الصف الثاني الابتدائي</option>
                            <option value="الصف الثالث الابتدائي">الصف الثالث الابتدائي</option>
                            <option value="الصف الرابع الابتدائي">الصف الرابع الابتدائي</option>
                            <option value="الصف الخامس الابتدائي">الصف الخامس الابتدائي</option>
                            <option value="الصف السادس الابتدائي">الصف السادس الابتدائي</option>
                            <option value="الصف الأول الاعدادي">الصف الأول الاعدادي</option>
                            <option value="الصف الثاني الاعدادي">الصف الثاني الاعدادي</option>
                            <option value="الصف الثالث الاعدادي">الصف الثالث الاعدادي</option>
                        </select>
                    </div>
                    <div>
                        <label style="font-size: 12px; font-weight: bold;">رقم المحمول</label>
                        <input type="text" id="modalPhone" class="form-control">
                    </div>
                    <div>
                        <label style="font-size: 12px; font-weight: bold;">كلمة المرور</label>
                        <input type="text" id="modalPassword" class="form-control" required>
                    </div>
                    <div>
                        <label style="font-size: 12px; font-weight: bold;">حالة الحضور والغياب</label>
                        <select id="modalAttendance" class="form-control">
                            <option value="منتظم">منتظم</option>
                            <option value="غائب اليوم">غائب اليوم</option>
                            <option value="مزوغ / استئذان">مزوغ / استئذان</option>
                        </select>
                    </div>
                </div>

                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">حفظ التعديلات 💾</button>
                    <button type="button" onclick="deleteUserByAdmin()" class="btn btn-danger">حذف الحساب نهائياً 🗑️</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAE995CZXAe212KXhrlQjyY2Nw2SCfw8WA",
            authDomain: "green-damietta-b0a29.firebaseapp.com",
            databaseURL: "https://green-damietta-b0a29-default-rtdb.firebaseio.com",
            projectId: "green-damietta-b0a29",
            storageBucket: "green-damietta-b0a29.firebasestorage.app",
            messagingSenderId: "210935345765",
            appId: "1:210935345765:web:53ba42e2116f8e432bcc8c",
            measurementId: "G-CT9KYEKXML"
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();

        let usersCache = {};

        window.addEventListener('DOMContentLoaded', () => {
            loadUsersLive();
        });

        // تحميل كافه المسجلين بالبوابة
        function loadUsersLive() {
            db.ref('students').on('value', (snapshot) => {
                usersCache = snapshot.val() || {};
                const tbody = document.getElementById('adminUsersTableBody');
                tbody.innerHTML = '';

                const keys = Object.keys(usersCache);
                if (keys.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">لا يوجد مستخدمين مسجلين حالياً.</td></tr>';
                    return;
                }

                keys.forEach(k => {
                    const u = usersCache[k];
                    const name = u.role === 'parent' ? (u.parentName || u.name) : u.name;
                    const idVal = u.nationalId || u.parentNationalId || u.code || '---';

                    tbody.innerHTML += `
                        <tr>
                            <td><b>${name}</b></td>
                            <td>${u.role === 'parent' ? '👨‍👩‍👦 ولي أمر' : '🎓 طالب'}</td>
                            <td>${u.grade || 'غير محدد'}</td>
                            <td>${idVal}</td>
                            <td>
                                <button onclick="openProfileModal('${k}')" class="btn btn-primary" style="padding: 6px 12px; font-size: 12px;">👁️ عرض البروفايل والتعديل</button>
                            </td>
                        </tr>
                    `;
                });
            });
        }

        // فتح البروفايل للتعديل
        function openProfileModal(key) {
            const u = usersCache[key];
            if (!u) return;

            document.getElementById('modalUserKey').value = key;
            document.getElementById('modalName').value = u.role === 'parent' ? (u.parentName || u.name) : u.name;
            document.getElementById('modalGrade').value = u.grade || 'الصف الأول الابتدائي';
            document.getElementById('modalPhone').value = u.phone || '';
            document.getElementById('modalPassword').value = u.password || '';
            document.getElementById('modalAttendance').value = u.attendance || 'منتظم';

            document.getElementById('profileModal').style.display = 'flex';
        }

        function closeProfileModal() {
            document.getElementById('profileModal').style.display = 'none';
        }

        // حفظ تعديل البروفايل من قبل الإدارة
        async function saveUserProfileByAdmin(e) {
            e.preventDefault();
            const key = document.getElementById('modalUserKey').value;
            if (!key) return;

            const u = usersCache[key];
            const updatedData = {
                grade: document.getElementById('modalGrade').value,
                phone: document.getElementById('modalPhone').value.trim(),
                password: document.getElementById('modalPassword').value.trim(),
                attendance: document.getElementById('modalAttendance').value
            };

            if (u.role === 'parent') {
                updatedData.parentName = document.getElementById('modalName').value.trim();
            } else {
                updatedData.name = document.getElementById('modalName').value.trim();
            }

            await db.ref('students/' + key).update(updatedData);
            alert('✅ تم تحديث بيانات البروفايل بنجاح!');
            closeProfileModal();
        }

        // حذف المستخدم من قبل الإدارة
        async function deleteUserByAdmin() {
            const key = document.getElementById('modalUserKey').value;
            if (!key) return;

            if (confirm('⚠️ هل أنت تأكد من رغبتك في حذف هذا الحساب نهائياً؟')) {
                await db.ref('students/' + key).remove();
                alert('🗑️ تم حذف الحساب بنجاح.');
                closeProfileModal();
            }
        }

        // نشر خبر جديد
        async function postNews(e) {
            e.preventDefault();
            const title = document.getElementById('newsTitle').value.trim();
            const badge = document.getElementById('newsBadge').value.trim() || 'إعلان مدرسي';
            const content = document.getElementById('newsContent').value.trim();

            await db.ref('news').push({
                title, badge, content, timestamp: Date.now()
            });

            alert('✅ تم نشر الخبر على البوابة بنجاح!');
            document.getElementById('newsTitle').value = '';
            document.getElementById('newsBadge').value = '';
            document.getElementById('newsContent').value = '';
        }
    </script>
</body>
</html>
