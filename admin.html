<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | إضافة الدروس والاختبارات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #0284C7;
            --primary-dark: #0369A1;
            --accent: #F59E0B;
            --card-bg: #FFFFFF;
            --text-dark: #0F172A;
            --border: #CBD5E1;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background: #F1F5F9; padding: 30px; color: var(--text-dark); }
        .container { max-width: 700px; margin: auto; background: var(--card-bg); padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h2 { color: var(--primary-dark); font-weight: 900; margin-bottom: 20px; text-align: center; }
        .form-group { margin-bottom: 16px; text-align: right; }
        label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 6px; color: #475569; }
        .form-control { width: 100%; padding: 12px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 14px; outline: none; }
        .form-control:focus { border-color: var(--primary); }
        .btn-submit { background: var(--primary); color: white; border: none; padding: 14px; width: 100%; border-radius: 10px; font-size: 16px; font-weight: 800; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
        .btn-submit:hover { background: var(--primary-dark); }
    </style>
</head>
<body>

    <div class="container">
        <h2>⚙️ إضافة درس أو اختبار جديد</h2>
        <form onsubmit="addNewLesson(event)">
            <div class="form-group">
                <label>عنوان الدرس أو الاختبار</label>
                <input type="text" id="lessonTitle" class="form-control" placeholder="مثال: مقدمة في علم الجبر..." required>
            </div>
            <div class="form-group">
                <label>المادة الدراسية</label>
                <input type="text" id="lessonSubject" class="form-control" placeholder="مثال: الرياضيات" required>
            </div>
            <div class="form-group">
                <label>محتوى الدرس (شرح مكتوب)</label>
                <textarea id="lessonContent" class="form-control" rows="4" placeholder="اكتب تفاصيل وشرح الدرس هنا..."></textarea>
            </div>
            <div class="form-group">
                <label>رابط فيديو الشرح (يوتيوب أو رابط مباشر)</label>
                <input type="url" id="lessonVideoUrl" class="form-control" placeholder="https://...">
            </div>
            <button type="submit" class="btn-submit">نشر الدرس على المنصة 🚀</button>
        </form>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://green-damietta-b0a29-default-rtdb.firebaseio.com" };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();

        function addNewLesson(e) {
            e.preventDefault();
            const title = document.getElementById('lessonTitle').value.trim();
            const subject = document.getElementById('lessonSubject').value.trim();
            const content = document.getElementById('lessonContent').value.trim();
            const videoUrl = document.getElementById('lessonVideoUrl').value.trim();

            const lessonKey = 'lesson_' + Date.now();
            db.ref('lessons/' + lessonKey).set({
                title, subject, content, videoUrl, timestamp: Date.now()
            }).then(() => {
                alert('تم إضافة ونشر الدرس بنجاح للطلاب! 🎉');
                document.getElementById('lessonTitle').value = '';
                document.getElementById('lessonSubject').value = '';
                document.getElementById('lessonContent').value = '';
                document.getElementById('lessonVideoUrl').value = '';
            }).catch(error => {
                alert('حدث خطأ أثناء النشر: ' + error.message);
            });
        }
    </script>
</body>
</html>
