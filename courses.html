<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصتي التعليمية - الدورات</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f4f7f6; color: #333; }
        header { background-color: #2c3e50; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        nav a { color: white; text-decoration: none; margin-left: 20px; font-weight: bold; }
        nav a:hover { color: #1abc9c; }
        .container { max-width: 1200px; margin: 3rem auto; padding: 0 1rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        .card h3 { color: #2c3e50; }
        .btn { display: inline-block; background-color: #1abc9c; color: white; padding: 8px 20px; text-decoration: none; border-radius: 4px; margin-top: 15px; }
        .btn:hover { background-color: #16a085; }
        footer { text-align: center; padding: 1.5rem; background-color: #2c3e50; color: white; margin-top: 3rem; }
    </style>
</head>
<body>

    <header>
        <h2>منصتي التعليمية</h2>
        <nav>
            <a href="index.html">الرئيسية</a>
            <a href="courses.html">الدورات</a>
            <a href="dashboard.html">لوحة التحكم</a>
        </nav>
    </header>

    <div class="container">
        <h2>دوراتنا المتاحة</h2>
        <div class="grid">
            <div class="card">
                <h3>تطوير الويب الشامل</h3>
                <p>تعلم HTML, CSS, و JavaScript واحترف بناء المواقع من الصفر.</p>
                <a href="dashboard.html" class="btn">اشترك الآن</a>
            </div>
            <div class="card">
                <h3>أساسيات البرمجة بلغة بايثون</h3>
                <p>ابدأ رحلتك في عالم البرمجة وتحليل البيانات بأسهل طريقة.</p>
                <a href="dashboard.html" class="btn">اشترك الآن</a>
            </div>
        </div>
    </div>

    <footer>
        <p>جميع الحقوق محفوظة &copy; 2026</p>
    </footer>

</body>
</html>
