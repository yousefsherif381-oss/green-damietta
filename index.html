<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة التعلم الذكي | منصة الطالب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --primary: #0284C7;
            --primary-dark: #0369A1;
            --accent: #F59E0B;
            --accent-hover: #D97706;
            --danger: #EF4444;
            --success: #10B981;
            --card-bg: rgba(255, 255, 255, 0.9);
            --text-dark: #0F172A;
            --text-muted: #64748B;
            --border: rgba(255, 255, 255, 0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }

        body {
            background: linear-gradient(-45deg, #0284C7, #0F172A, #0369A1, #0C4A6E);
            background-size: 400% 400%;
            animation: oceanWaves 16s ease infinite;
            min-height: 100vh;
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
        }

        @keyframes oceanWaves {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        header {
            background: rgba(12, 74, 110, 0.75);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            position: sticky; top: 0; z-index: 100;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
        }

        .nav-container {
            max-width: 1300px; margin: auto; padding: 14px 20px;
            display: flex; justify-content: space-between; align-items: center; gap: 15px; flex-wrap: wrap;
        }

        .logo-area { display: flex; align-items: center; gap: 12px; text-decoration: none; cursor: pointer; }
        .logo-box {
            width: 50px; height: 50px; border-radius: 50%; background: #0F172A; padding: 2px;
            border: 2px solid var(--accent); box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        .logo-box img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
        .logo-text { font-size: 18px; font-weight: 900; color: #FFFFFF; text-shadow: 0 2px 4px rgba(0,0,0,0.4); }

        .main-wrapper { max-width: 1100px; width: 100%; margin: 30px auto; padding: 0 20px; flex: 1; }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 24px; padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            margin-bottom: 25px;
            border-top: 5px solid var(--accent);
        }

        .card-title { font-size: 19px; font-weight: 900; color: var(--primary-dark); margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }

        .btn { padding: 10px 18px; border-radius: 12px; border: none; font-weight: 800; font-size: 13.5px; cursor: pointer; transition: all 0.25s ease; }
        .btn:hover { transform: translateY(-2px); }
        .btn-primary { background: var(--primary); color: white; box-shadow: 0 4px 15px rgba(2, 132, 199, 0.3); }

        .custom-toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px);
            background: #0F172A; color: white; padding: 16px 28px; border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); border: 2px solid var(--accent);
            display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 14.5px;
            z-index: 3000; opacity: 0; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); pointer-events: none;
        }
        .custom-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>

    <div id="customToast" class="custom-toast">
        <span id="toastIcon">✨</span>
        <span id="toastMessage">تمت العملية بنجاح</span>
    </div>

    <header>
        <div class="nav-container">
            <div class="logo-area">
                <div class="logo-box">
                    <img src="https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?w=150&auto=format&fit=crop&q=80" alt="شعار">
                </div>
                <span class="logo-text">بوابة التعلم الذكي - منصة الطالب</span>
            </div>
            <div id="studentHeaderInfo" style="color: #fff; font-weight: 700; font-size: 14px;">جاري التحميل...</div>
        </div>
    </header>

    <main class="main-wrapper">

        <!-- لوحة ترحيبية ومعلومات الطالب -->
        <div class="card">
            <div class="card-title">👋 أهلاً بك يا بطل في بوابتك التعليمية</div>
            <div id="studentWelcomeBox" style="font-size: 15px; color: #334155; line-height: 1.6;">
                جاري تحميل بيانات حسابك الدراسي...
            </div>
        </div>

        <!-- قائمة الدروس والامتحانات المخصصة لصف الطالب -->
        <div class="card">
            <div class="card-title">📚 الدروس والاختبارات التفاعلية الخاصة بصفك الدراسي</div>
            <div id="studentLessonsList">جاري جلب المحتوى المخصص لك...</div>
        </div>

        <!-- صندوق عرض الدرس أو الامتحان المحدد -->
        <div class="card" id="activeLessonViewer" style="display: none;">
            <div id="lessonViewerContent"></div>
            <button onclick="closeLessonViewer()" class="btn btn-primary" style="margin-top: 20px;">العودة للقائمة الرئيسية ↩️</button>
        </div>

    </main>

    <script>
        const firebaseConfig = { databaseURL: "https://green-damietta-b0a29-default-rtdb.firebaseio.com" };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();

        let currentUser = null;
        let currentQuizData = null;
        let activeLessonKey = null;

        window.addEventListener('DOMContentLoaded', () => {
            // استرجاع بيانات الطالب المسجل حالياً (افتراضي أو مخزن محلياً)
            currentUser = JSON.parse(localStorage.getItem('currentStudent')) || {
                name: "يوسف طالب متميز",
                grade: "الصف الثاني الإعدادي",
                firebaseKey: "student_default_key"
            };

            document.getElementById('studentHeaderInfo').innerHTML = `👤 ${currentUser.name} | 🏫 ${currentUser.grade}`;
            document.getElementById('studentWelcomeBox').innerHTML = `
                أهلاً بك يا <b>${currentUser.name}</b>. أنت مسجل في <b>${currentUser.grade}</b>. 
                جميع الدروس والامتحانات أدناه مخصصة ومفلترة خصيصاً لصفك الدراسي لتطوير مستواك على غرار منصة أبواب!
            `;

            loadStudentLessons(currentUser.grade);
        });

        function showToast(message, icon = "✅", autoHide = true, duration = 3500) {
            const toast = document.getElementById('customToast');
            document.getElementById('toastIcon').textContent = icon;
            document.getElementById('toastMessage').textContent = message;
            toast.classList.add('show');
            if (autoHide) setTimeout(() => { toast.classList.remove('show'); }, duration);
        }

        // جلب الدروس وفلترتها حسب صف الطالب حصرياً
        function loadStudentLessons(studentGrade) {
            const listContainer = document.getElementById('studentLessonsList');
            db.ref('lessons').on('value', snapshot => {
                const lessons = snapshot.val();
                listContainer.innerHTML = '';

                if (!lessons) {
                    listContainer.innerHTML = '<p style="color:var(--text-muted);">لا توجد دروس أو اختبارات منشورة حالياً.</p>';
                    return;
                }

                let foundAny = false;
                Object.keys(lessons).reverse().forEach(key => {
                    const lesson = lessons[key];
                    
                    // الشرط الذهبي: عرض الدرس فقط إذا كان مطابقاً لصف الطالب أو عام
                    if (!lesson.grade || lesson.grade === studentGrade) {
                        foundAny = true;
                        listContainer.innerHTML += `
                            <div style="background:#F8FAFC; padding:16px; border-radius:14px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; border:1px solid #E2E8F0; border-right:4px solid var(--primary);">
                                <div>
                                    <b style="color:var(--primary-dark); font-size:15px;">${lesson.isQuiz ? '📝 اختبار تفاعلي: ' : '📖 درس تعليمي: '} ${lesson.title}</b>
                                    <p style="font-size:12.5px; color:var(--text-muted); margin-top:4px;">المادة: ${lesson.subject || 'عام'} | الصف: ${lesson.grade || 'جميع الصفوف'}</p>
                                </div>
                                <button onclick="openLesson('${key}')" class="btn btn-primary" style="padding:8px 16px; font-size:13px;">ابدأ الآن 🚀</button>
                            </div>
                        `;
                    }
                });

                if (!foundAny) {
                    listContainer.innerHTML = '<p style="color:var(--text-muted);">لا توجد دروس أو اختبارات مخصصة لصفك الدراسي في الوقت الحالي.</p>';
                }
            });
        }

        function openLesson(key) {
            activeLessonKey = key;
            db.ref('lessons/' + key).once('value', snapshot => {
                const lesson = snapshot.val();
                if (!lesson) return;

                const viewer = document.getElementById('activeLessonViewer');
                const contentBox = document.getElementById('lessonViewerContent');
                viewer.style.display = 'block';
                window.scrollTo({ top: viewer.offsetTop - 20, behavior: 'smooth' });

                if (lesson.isQuiz && lesson.questions) {
                    currentQuizData = lesson.questions;
                    let quizHtml = `<h3 style="color: var(--primary-dark); margin-bottom: 20px; font-size: 18px;">📝 ${lesson.title}</h3>`;
                    
                    currentQuizData.forEach((q, qIndex) => {
                        quizHtml += `
                            <div style="background: #FFFFFF; padding: 20px; border-radius: 16px; margin-bottom: 18px; border: 1.5px solid #E2E8F0;">
                                <p style="font-weight: 800; margin-bottom: 14px; color: #0F172A; font-size: 15px; direction: ltr; text-align: left;">
                                    <span style="color: var(--primary); font-weight: 900; margin-right: 6px;">Q${qIndex + 1}:</span> ${q.questionText}
                                </p>
                                <div style="display: flex; flex-direction: column; gap: 10px; direction: ltr; text-align: left;">
                        `;
                        q.options.forEach((opt, optIndex) => {
                            quizHtml += `
                                <label id="label_${qIndex}_${optIndex}" style="display: flex; align-items: center; gap: 10px; font-size: 14px; cursor: pointer; font-weight: 600; background: #F8FAFC; padding: 12px 14px; border-radius: 12px; border: 1px solid #E2E8F0;">
                                    <input type="radio" name="question_${qIndex}" value="${optIndex}"> <span>${opt}</span>
                                </label>
                            `;
                        });
                        quizHtml += `
                                </div>
                                <div id="explanation_${qIndex}" style="display: none; margin-top: 12px; padding: 10px 14px; background: #E0F2FE; border-radius: 10px; font-size: 13px; color: #0369A1; font-weight: 700; direction: ltr; text-align: left;">
                                    💡 <b>Explanation:</b> ${q.explanation || 'The correct scientific choice based on the curriculum.'}
                                </div>
                            </div>
                        `;
                    });

                    quizHtml += `<button onclick="submitQuizAnswers()" class="btn btn-primary" style="background: var(--accent); margin-top: 15px; width: 100%; font-size: 16px;">إرسال وتسليم الاختبار 🚀</button>`;
                    quizHtml += `<div id="quizResultDisplay" style="margin-top: 20px; font-weight: 900; font-size: 18px; text-align: center;"></div>`;
                    contentBox.innerHTML = quizHtml;
                } else {
                    contentBox.innerHTML = `
                        <h3 style="color: var(--primary-dark); margin-bottom: 15px; font-size: 18px;">📖 ${lesson.title}</h3>
                        <p style="font-size: 15px; line-height: 1.8; color: #334155; margin-bottom: 20px;">${lesson.content || 'لا يوجد شرح نصي متاح.'}</p>
                        ${lesson.videoUrl ? `<div style="position:relative; padding-bottom:56.25%; height:0;"><iframe src="${lesson.videoUrl}" style="position:absolute; top:0; left:0; width:100%; height:100%; border-radius:12px;" frameborder="0" allowfullscreen></iframe></div>` : ''}
                    `;
                }
            });
        }

        function submitQuizAnswers() {
            if (!currentQuizData) return;
            let score = 0;
            let total = currentQuizData.length;

            currentQuizData.forEach((q, qIndex) => {
                const selectedOpt = document.querySelector(`input[name="question_${qIndex}"]:checked`);
                const explanationBox = document.getElementById(`explanation_${qIndex}`);
                if (explanationBox) explanationBox.style.display = 'block';

                q.options.forEach((opt, optIndex) => {
                    const labelEl = document.getElementById(`label_${qIndex}_${optIndex}`);
                    if (labelEl) {
                        labelEl.style.pointerEvents = 'none';
                        if (optIndex === q.correctOption) {
                            labelEl.style.background = '#D1FAE5';
                            labelEl.style.borderColor = '#10B981';
                            labelEl.style.color = '#065F46';
                        } else if (selectedOpt && parseInt(selectedOpt.value) === optIndex) {
                            labelEl.style.background = '#FEE2E2';
                            labelEl.style.borderColor = '#EF4444';
                            labelEl.style.color = '#991B1B';
                        }
                    }
                });

                if (selectedOpt && parseInt(selectedOpt.value) === parseInt(q.correctOption)) {
                    score++;
                }
            });

            const percentage = ((score / total) * 100).toFixed(0);
            const resultDiv = document.getElementById('quizResultDisplay');
            if (resultDiv) {
                resultDiv.innerHTML = `نتيجة الاختبار: ${score} من ${total} (${percentage}%) 🎉`;
                resultDiv.style.color = percentage >= 50 ? '#10B981' : '#EF4444';
            }

            if (percentage >= 50) {
                showToast("ممتاز! نجحت في الاختبار واجتزت المحتوى بنجاح 🎉", "🏆");
                if (typeof confetti === 'function') confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            } else {
                showToast("راجع الشرح تحت الأسئلة وحاول مرة أخرى ⚠️", "📌");
            }
        }

        function closeLessonViewer() {
            document.getElementById('activeLessonViewer').style.display = 'none';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
