<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدرسة جرين دمياط الرسمية للغات</title>
    
    <!-- مكتبات Firebase الأساسية -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --primary-color: #2e7d32;
            --accent-color: #4caf50;
            --bg-color: #f4f7f6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            direction: rtl;
            color: #333;
        }

        header {
            background-color: var(--primary-color);
            color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .news-card {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border-right: 6px solid var(--accent-color);
            transition: transform 0.2s;
        }

        .news-card:hover {
            transform: translateY(-2px);
        }

        .news-title {
            margin: 0 0 10px 0;
            color: var(--primary-color);
            font-size: 18px;
        }

        .news-content {
            margin: 0 0 10px 0;
            line-height: 1.6;
        }

        .news-date {
            font-size: 12px;
            color: #888;
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: #777;
            background: white;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>مدرسة جرين دمياط الرسمية للغات 🏫</h1>
    </header>

    <div class="container">
        <h3>📢 أحدث الأخبار والتنبيهات:</h3>
        <div id="news-container">
            <div class="no-data">جاري تحميل البيانات...</div>
        </div>
    </div>

    <script>
        // إعدادات اتصال Firebase الخاصة بمشروعك
        const firebaseConfig = {
            databaseURL: "https://green-damietta-b0a29-default-rtdb.firebaseio.com/"
        };

        // تهيئة فايربيس
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const db = firebase.database();
        const newsContainer = document.getElementById('news-container');

        // جلب الأخبار وتحديثها أوتوماتيكياً
        db.ref('news').on('value', (snapshot) => {
            newsContainer.innerHTML = '';
            const data = snapshot.val();

            if (data) {
                // تحويل البيانات لمصفوفة وعرض أحدث الأخبار في الأول
                const newsList = Object.keys(data).map(key => ({
                    id: key,
                    ...data[key]
                })).reverse();

                newsList.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'news-card';
                    card.innerHTML = `
                        <h4 class="news-title">${item.title || 'تنبيه مدرسي'}</h4>
                        <p class="news-content">${item.content || ''}</p>
                        <div class="news-date">📅 ${item.date || 'منذ قليل'}</div>
                    `;
                    newsContainer.appendChild(card);
                });
            } else {
                newsContainer.innerHTML = '<div class="no-data">لا توجد أخبار أو تنبيهات حالياً.</div>';
            }
        }, (error) => {
            console.error("خطأ في جلب البيانات:", error);
            newsContainer.innerHTML = '<div class="no-data">حدث خطأ أثناء تحميل الأخبار، يرجى المحاولة لاحقاً.</div>';
        });
    </script>
</body>
</html>
