<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة مدرسة اللغات الرسمية الجديدة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #0284C7;
            --primary-dark: #0369A1;
            --accent: #F59E0B;
            --card-bg: rgba(255, 255, 255, 0.98);
            --text-dark: #0F172A;
            --text-muted: #64748B;
            --border: #E2E8F0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }

        body {
            background: linear-gradient(-45deg, #0284C7, #0F172A, #0369A1, #0C4A6E);
            background-size: 400% 400%;
            animation: oceanWaves 16s ease infinite;
            min-height: 100vh;
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
        }

        @keyframes oceanWaves {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        header {
            background: rgba(12, 74, 110, 0.92);
            backdrop-filter: blur(14px);
            border-bottom: 3px solid var(--accent);
            padding: 15px 20px;
            text-align: center;
            color: white;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
        }

        .main-container {
            max-width: 900px;
            width: 100%;
            margin: 30px auto;
            padding: 0 20px;
            flex: 1;
        }

        .news-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.3);
            margin-bottom: 25px;
            border-top: 5px solid var(--accent);
        }

        .news-title {
            font-size: 20px;
            font-weight: 900;
            color: var(--primary-dark);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .news-badge {
            background: var(--accent);
            color: white;
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 700;
        }

        .news-content {
            font-size: 15px;
            color: #334155;
            line-height: 1.7;
            margin-bottom: 15px;
        }

        .media-container {
            margin-top: 15px;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .media-container img, .media-container video {
            width: 100%;
            max-height: 450px;
            object-fit: contain;
            display: block;
        }
    </style>
</head>
<body>

    <header>
        <h1>مدرسة اللغات الرسمية الجديدة</h1>
        <p>بوابة متابعة الطلاب والأخبار المدرسية</p>
    </header>

    <main class="main-container">
        <h2 style="color: white; margin-bottom: 20px; font-size: 22px; text-shadow: 0 2px 4px rgba(0,0,0,0.5);">📢 أحدث الإعلانات والأخبار المدرسية:</h2>
        <div id="publicNewsContainer">جاري تحميل الأخبار والإعلانات...</div>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAE995CZXAe212KXhrlQjyY2Nw2SCfw8WA",
            authDomain: "green-damietta-b0a29.firebaseapp.com",
            databaseURL: "https://green-damietta-b0a29-default-rtdb.firebaseio.com",
            projectId: "green-damietta-b0a29",
            storageBucket: "green-damietta-b0a29.firebasestorage.app",
            messagingSenderId: "210935345765",
            appId: "1:210935345765:web:53ba42e2116f8e432bcc8c",
            measurementId: "G-CT9KYEKXML"
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();

        window.addEventListener('DOMContentLoaded', () => {
            loadPublicNews();
        });

        function loadPublicNews() {
            db.ref('news').on('value', (snapshot) => {
                const container = document.getElementById('publicNewsContainer');
                container.innerHTML = '';
                const newsData = snapshot.val();
                
                if (!newsData) {
                    container.innerHTML = '<p style="color: white; text-align: center; background: rgba(255,255,255,0.1); padding: 20px; border-radius: 12px;">لا توجد إعلانات منشورة حالياً.</p>';
                    return;
                }

                Object.keys(newsData).reverse().forEach(key => {
                    const item = newsData[key];
                    
                    let mediaHtml = '';
                    if (item.image) {
                        mediaHtml += `<div class="media-container"><img src="${item.image}" alt="صورة الإعلان"></div>`;
                    }
                    if (item.video) {
                        mediaHtml += `
                            <div class="media-container" style="margin-top: 10px;">
                                <video controls preload="metadata">
                                    <source src="${item.video}" type="video/mp4">
                                    متصفحك لا يدعم عرض الفيديو
                                </video>
                            </div>`;
                    }

                    container.innerHTML += `
                        <div class="news-card">
                            <div class="news-title">
                                <span>📌 ${item.title}</span>
                                <span class="news-badge">${item.badge}</span>
                            </div>
                            <p class="news-content">${item.content}</p>
                            ${mediaHtml}
                        </div>
                    `;
                });
            });
        }
    </script>
</body>
</html>
