<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة التعلم الذكي | الدروس والمنهج التعليمي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #0284C7;
            --primary-dark: #0369A1;
            --accent: #F59E0B;
            --success: #10B981;
            --pending: #94A3B8;
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-dark: #0F172A;
            --text-muted: #64748B;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        
        body {
            background: linear-gradient(-45deg, #0284C7, #0F172A, #0369A1, #0C4A6E);
            background-size: 400% 400%;
            animation: oceanWaves 16s ease infinite;
            min-height: 100vh;
            color: var(--text-dark);
            padding: 20px;
        }

        @keyframes oceanWaves {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container { max-width: 900px; margin: 0 auto; }

        header {
            text-align: center; color: white; margin-bottom: 30px;
        }
        header h1 { font-size: 28px; font-weight: 900; margin-bottom: 5px; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }
        header p { font-size: 14px; opacity: 0.9; }

        .card {
            background: var(--card-bg);
            border-radius: 20px; padding: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 18px; font-weight: 800; color: var(--primary-dark);
            margin-bottom: 15px; display: flex; align-items: center; gap: 8px;
        }

        /* قائمة الدروس */
        .lessons-list { display: flex; flex-direction: column; gap: 12px; }
        .lesson-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 20px; background: #F8FAFC; border-radius: 14px;
            border: 1.5px solid #E2E8F0; transition: all 0.3s ease;
        }
        .lesson-item:hover { border-color: var(--primary); transform: translateY(-2px); }
        
        .lesson-info h3 { font-size: 16px; font-weight: 800; color: var(--text-dark); margin-bottom: 4px; }
        .lesson-info p { font-size: 12.5px; color: var(--text-muted); }

        .lesson-status {
            display: flex; align-items: center; gap: 12px;
        }
        .badge {
            padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700;
        }
        .badge.completed { background: #D1FAE5; color: #065F46; }
        .badge.pending { background: #F1F5F9; color: #475569; }

        .btn-action {
            background: var(--primary); color: white; border: none;
            padding: 8px 16px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer;
            transition: background 0.2s;
        }
        .btn-action:hover { background: var(--primary-dark); }

        /* مشغل الدرس */
        .lesson-viewer {
            display: none; background: white; border-radius: 20px; padding: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2); margin-top: 20px;
        }
        .btn-back {
            background: rgba(2, 132, 199, 0.1); color: var(--primary-dark); border: none;
            padding: 6px 14px; border-radius: 8px; font-weight: 700; cursor: pointer; margin-bottom: 15px;
        }
        .lesson-content-box { margin: 15px 0; font-size: 15px; color: #334155; line-height: 1.8; }
        .lesson-video { width: 100%; max-height: 400px; border-radius: 12px; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>📚 بوابة التعلم الذكي التفاعلية</h1>
            <p>تصفح دروسك وتتبع نسبة إنجازك أولاً بأول</p>
        </header>

        <!-- قسم عرض الدروس -->
        <div class="card" id="lessonsMainCard">
            <div class="section-title">📖 قائمة الدروس التعليمية</div>
            <div class="lessons-list" id="studentLessonsList">
                <p style="text-align: center; color: var(--text-muted); padding: 20px;">جاري تحميل الدروس...</p>
            </div>
        </div>

        <!-- صندوق عرض تفاصيل الدرس عند فتحه -->
        <div class="lesson-viewer" id="lessonViewerCard">
            <button class="btn-back" onclick="closeLessonViewer()">⬅️ العودة لقائمة الدروس</button>
            <h2 id="viewerLessonTitle" style="color: var(--primary-dark); font-weight: 900; margin-bottom: 10px;"></h2>
            <div class="lesson-content-box" id="viewerLessonContent"></div>
            <div id="viewerMediaContainer"></div>
            <button class="btn-action" style="margin-top: 20px; background: var(--success); width: 100%; padding: 12px; font-size: 15px;" onclick="markLessonAsCompleted()">
                ✨ تم إنهاء ومشاهدة الدرس بنجاح
            </button>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://green-damietta-b0a29-default-rtdb.firebaseio.com" };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();

        // محاكاة كود طالب حالي (يمكن ربطه بنظام تسجيل الدخول لاحقاً)
        let currentStudentId = "student_demo_01"; 
        let activeLessonKey = null;

        document.addEventListener("DOMContentLoaded", () => {
            loadStudentLessons();
        });

        function loadStudentLessons() {
            const listContainer = document.getElementById('studentLessonsList');
            
            // جلب الدروس وجلب حالة إنجاز الطالب في نفس الوقت
            db.ref('lessons').on('value', (lessonsSnapshot) => {
                const lessons = lessonsSnapshot.val();
                
                db.ref('studentProgress/' + currentStudentId).on('value', (progressSnapshot) => {
                    const progress = progressSnapshot.val() || {};
                    listContainer.innerHTML = '';

                    if (!lessons) {
                        listContainer.innerHTML = '<p style="text-align: center; color: var(--text-muted);">لا توجد دروس مضافة حالياً من قبل الإدارة.</p>';
                        return;
                    }

                    Object.keys(lessons).forEach(key => {
                        const lesson = lessons[key];
                        const isCompleted = progress[key] === true; // هل خلص الدرس؟

                        listContainer.innerHTML += `
                            <div class="lesson-item">
                                <div class="lesson-info">
                                    <h3>${lesson.title}</h3>
                                    <p>${lesson.subject || 'مادة عامة'} ⏱️ ${lesson.duration || '15'} دقيقة</p>
                                </div>
                                <div class="lesson-status">
                                    <span class="badge ${isCompleted ? 'completed' : 'pending'}">
                                        ${isCompleted ? '✅ تم الإنجاز' : '⏳ لم يُكتمل'}
                                    </span>
                                    <button class="btn-action" onclick="openLesson('${key}')">فتح الدرس</button>
                                </div>
                            </div>
                        `;
                    });
                });
            });
        }

        function openLesson(lessonKey) {
            activeLessonKey = lessonKey;
            db.ref('lessons/' + lessonKey).once('value').then(snapshot => {
                const lesson = snapshot.val();
                if (lesson) {
                    document.getElementById('lessonsMainCard').style.display = 'none';
                    document.getElementById('lessonViewerCard').style.display = 'block';

                    document.getElementById('viewerLessonTitle').textContent = lesson.title;
                    document.getElementById('viewerLessonContent').innerHTML = lesson.content || 'لا توجد تفاصيل نصية.';

                    const mediaContainer = document.getElementById('viewerMediaContainer');
                    mediaContainer.innerHTML = '';
                    if (lesson.videoUrl) {
                        mediaContainer.innerHTML = `<video controls class="lesson-video"><source src="${lesson.videoUrl}" type="video/mp4">متصفحك لا يدعم عرض الفيديو.</video>`;
                    }
                }
            });
        }

        function closeLessonViewer() {
            document.getElementById('lessonViewerCard').style.display = 'none';
            document.getElementById('lessonsMainCard').style.display = 'block';
            activeLessonKey = null;
        }

        function markLessonAsCompleted() {
            if (!activeLessonKey) return;
            // تسجيل أن الطالب أتم هذا الدرس في قاعدة البيانات
            db.ref('studentProgress/' + currentStudentId + '/' + activeLessonKey).set(true).then(() => {
                alert('ممتاز! تم تسجيل إنجازك للدرس بنجاح 🎉');
                closeLessonViewer();
            });
        }
    </script>
</body>
</html>
